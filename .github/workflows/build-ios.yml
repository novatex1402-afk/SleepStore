name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate 2>&1 | tee build.log

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project SleepStore.xcodeproj \
            -scheme SleepStore \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee -a build.log

      - name: Package IPA
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/SleepStore.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry SleepStore.ipa Payload
          ls -lh SleepStore.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SleepStore-unsigned-ipa
          path: SleepStore.ipa
          if-no-files-found: error

      - name: Write error log
        if: failure()
        run: |
          touch build.log
          {
            echo "=== Errors ==="
            grep -nE "error:|fatal error|\*\* BUILD FAILED \*\*|Command .* failed" build.log || true
            echo
            echo "=== Last 200 lines ==="
            tail -n 200 build.log
          } > error.txt

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SleepStore-build-error
          path: error.txt
