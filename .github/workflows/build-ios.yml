name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-16
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen 2>&1 | tee build.log

      - name: Generate project
        run: xcodegen generate 2>&1 | tee -a build.log

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild \
            -project SleepStore.xcodeproj \
            -scheme SleepStore \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath SourcePackages 2>&1 | tee -a build.log

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project SleepStore.xcodeproj \
            -scheme SleepStore \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee -a build.log

      - name: Package IPA
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/SleepStore.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry SleepStore.ipa Payload
          ls -lh SleepStore.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SleepStore-unsigned-ipa
          path: SleepStore.ipa
          if-no-files-found: error

      - name: Write error log
        if: always()
        run: |
          touch build.log
          {
            echo "=== Errors ==="
            grep -nE "error:|fatal error|\*\* BUILD FAILED \*\*|Command .* failed" build.log || true
            echo
            echo "=== Last 300 lines ==="
            tail -n 300 build.log
          } > error.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SleepStore-build-log
          path: |
            build.log
            error.txt
          if-no-files-found: warn
