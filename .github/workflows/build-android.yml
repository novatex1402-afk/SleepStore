name: Build Android (APK İmzalayıcı)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # İsteğe bağlı: APP_KEYSTORE_BASE64 secret'ı eklenirse uygulama her derlemede aynı anahtarla
      # imzalanır (güncelleme yaparken kaldırıp yeniden kurmak gerekmez).
      - name: Decode app keystore (optional)
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$APP_KEYSTORE_BASE64" ]; then
            echo "$APP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.p12"
            echo "APP_KEYSTORE_FILE=$RUNNER_TEMP/app.p12" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../ApkImzalayici.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApkImzalayici-apk
          path: ApkImzalayici.apk
          if-no-files-found: error
