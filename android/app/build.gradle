plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nxteam.apksigner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nxteam.apksigner'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        // GitHub Secrets ile sabit bir anahtar verilirse onu kullan (güncellemeler sorunsuz olur).
        // Verilmezse debug anahtarıyla imzalanır.
        release {
            def ksFile = System.getenv('APP_KEYSTORE_FILE')
            if (ksFile != null && new File(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv('APP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('APP_KEY_ALIAS')
                keyPassword System.getenv('APP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def ksFile = System.getenv('APP_KEYSTORE_FILE')
            signingConfig = (ksFile != null && new File(ksFile).exists()) ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/BCKEY.DSA', 'META-INF/BCKEY.SF',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    // Google'ın resmi, ücretsiz ve açık kaynak APK imzalama kütüphanesi (apksigner aracının kendisi)
    implementation 'com.android.tools.build:apksig:8.13.2'
    // Cihaz üzerinde ücretsiz, kendinden imzalı sertifika üretmek için
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.82'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.82'
}
